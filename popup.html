<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#fff; --fg:#1d1d1f; --mut:#6b6b73; --line:#e3e3e8; --warn:#d9730d; --ok:#1c8a4a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c20; --fg:#f2f2f5; --mut:#9a9aa5; --line:#33333a; } }
  body { margin:0; padding:14px; width:340px; background:var(--bg); color:var(--fg); font:13px/1.4 system-ui, sans-serif; }
  .host { font-weight:600; word-break:break-all; margin-bottom:10px; }
  .row { padding:8px 0; border-top:1px solid var(--line); }
  .lbl { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .ip { font:600 15px ui-monospace, Consolas, monospace; cursor:pointer; word-break:break-all; }
  .ip:hover { text-decoration:underline; }
  #res { white-space:pre-line; }
  .note { margin-top:8px; padding:8px; border-radius:6px; background:rgba(217,115,13,.12); color:var(--warn); }
  .good { background:rgba(28,138,74,.12); color:var(--ok); }
  .small { color:var(--mut); font-size:11px; }
  label { display:block; margin-top:10px; color:var(--mut); font-size:11px; }
</style>
</head>
<body>
  <div class="host" id="host">…</div>
  <div class="row"><div class="lbl">IP de conexión (lo que ve Chrome)</div><div class="ip" id="conn">—</div></div>
  <div class="row"><div class="lbl" id="resLbl">IP real del sitio (DNS)</div><div class="ip" id="res">—</div><div class="small" id="src"></div></div>
  <div id="verdict"></div>
  <div class="small" id="proxy" style="margin-top:8px"></div>
  <label style="color:var(--fg);font-size:13px"><input type="checkbox" id="bubble"> Burbuja flotante con la IP en las páginas</label>
  <label><input type="checkbox" id="doh"> Usar DNS público (Cloudflare) si no hay host nativo. Ojo: envía el nombre del sitio fuera de la empresa.</label>
  <script src="popup.js"></script>
</body>
</html>
